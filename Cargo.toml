[package]
name = "tongwen"
version = "0.3.0"
edition = "2024"

[dependencies]
axum = "0.8"
futures-util = "0.3"
opencc-rust = "2.0"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7", features = ["cors"] }
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
